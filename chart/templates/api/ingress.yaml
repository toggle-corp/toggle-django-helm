{{- if .Values.api.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "banjo.fullname" . }}-api
  labels:
    app: {{ include "banjo.fullname" . }}
    component: api
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
    {{- with (include "banjo.tplAnnotations" (dict "Annotations" .Values.api.ingress.labels "Context" $)) -}}{{ . | nindent 4 }}{{- end }}
  {{- with (include "banjo.tplAnnotations" (dict "Annotations" .Values.api.ingress.annotations "Context" $)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.api.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ required "api.ingress.host" .Values.api.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ template "banjo.fullname" . }}-api
                port:
                  number: 80

  {{- if .Values.api.ingress.tls.enabled }}
  tls:
    - secretName: {{ required "api.ingress.tls.secretName" .Values.api.ingress.tls.secretName }}
      hosts:
        - {{ .Values.api.ingress.host | quote }}
  {{- end }}

{{- end }}
