{{- if .Values.serviceAccount.create -}}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "banjo.serviceAccountName" . }}
  {{- with (include "banjo.resourceAnnotations" (dict "Override" .Values.serviceAccount.annotations "Context" $)) -}}{{ . | nindent 2 }}{{- end }}
  {{- /* The ServiceAccount sets no labels of its own, so nothing here can collide. */ -}}
  {{- with (include "banjo.resourceLabels" (dict "Override" .Values.serviceAccount.labels "OverridePath" "serviceAccount.labels" "Reserved" (list) "Context" $)) }}
  labels:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}

{{- end }}
