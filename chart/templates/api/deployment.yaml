{{- include "banjo.assertNoStrayKeys" (dict "Block" .Values.api "Path" "api" "Fields" (list "annotations") "Hint" "renamed to podAnnotations") -}}
{{- if .Values.api.enabled }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "banjo.fullname" . }}-api
  {{- with (include "banjo.appDefaultDeploymentAnnotations" (dict "Annotations" .Values.api.deploymentAnnotations "Context" $)) -}}{{ . | nindent 2 }}{{- end }}
  labels:
    app: {{ include "banjo.fullname" . }}
    component: api
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  {{- if not (eq .Values.api.replicaCount nil) }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: {{ include "banjo.fullname" . }}
      component: api
  template:
    metadata:
      annotations:
        {{- include "banjo.appDefaultAnnotations" $ | nindent 8 }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app: {{ include "banjo.fullname" . }}
        component: api
        {{- with (include "banjo.appDefaultLabels" $) -}}{{ . | nindent 8 }}{{- end }}
    spec:
      {{- with (include "banjo.appDefaultVolumes" (dict "Context" $)) -}}{{ . | nindent 6 }}{{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "banjo.serviceAccountName" $ }}
      {{- end }}
      {{- with (include "banjo.schedulingConfig" (dict "Default" (dict) "Override" .Values.api "Context" $)) -}}{{ . | nindent 6 }}{{- end }}
      {{- $preStop := int (default 0 (dig "lifecycle" "preStopSleepSeconds" 0 .Values.api)) }}
      {{- if .Values.api.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- else if gt $preStop 0 }}
      terminationGracePeriodSeconds: {{ add 30 $preStop }}
      {{- end }}
      containers:
        - name: api
          {{- include "banjo.imageConfig"
              (dict "Default" $.Values.image "Override" $.Values.api.image)
              | nindent 10
          }}
          {{- with .Values.api.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
              protocol: TCP
          {{- if .Values.api.probes.enabled }}
          {{- with .Values.api.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.probes.startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          envFrom:
            {{- include "banjo.envFromTemplate" $ | nindent 12 }}
          env:
            {{- include "banjo.envTemplate"
              (dict "Values" $.Values "Type" "web" )
              | nindent 12
          }}
            {{- include "banjo.extraEnvBlock"
              (dict "Default" (dict) "Override" .Values.api "Context" $)
              | nindent 12
          }}
          {{- if gt $preStop 0 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $preStop }}
          {{- end }}
          {{- with (include "banjo.appDefaultVolumeMounts" (dict "Context" $)) -}}{{ . | nindent 10 }}{{- end }}

{{- end }}
