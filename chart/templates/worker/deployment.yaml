{{- include "banjo.assertNoStraySchedulingKeys" (dict "Block" .Values.worker "Path" "worker" "Hint" "set it under worker.queueDefaults (queues) or worker.addonDefaults (addons)") -}}
{{- if .Values.worker.enabled }}

{{- $defaults := default dict .Values.worker.queueDefaults -}}
{{- include "banjo.assertNoStrayKeys" (dict "Block" $defaults "Path" "worker.queueDefaults" "Fields" (list "annotations") "Hint" "renamed to podAnnotations") -}}
{{- $queues := list -}}
{{- if kindIs "map" .Values.worker.queues -}}
  {{- range $name, $cfg := .Values.worker.queues -}}
    {{- $queues = append $queues (merge (dict "name" $name) (default dict $cfg)) -}}
  {{- end -}}
{{- else if kindIs "slice" .Values.worker.queues -}}
  {{- $queues = .Values.worker.queues -}}
{{- end -}}

{{- range $config := $queues }}
{{- if $config.enabled }}
{{- $queue_name := $config.name }}
{{- include "banjo.assertNoStrayKeys" (dict "Block" $config "Path" (printf "worker.queues.%s" $queue_name) "Fields" (list "annotations") "Hint" "renamed to podAnnotations") -}}
{{- $extraVolumes := fromYamlArray (include "banjo.namedListConfig" (dict "Default" $defaults.volumes "Override" $config.volumes)) }}
{{- $extraVolumeMounts := fromYamlArray (include "banjo.namedListConfig" (dict "Default" $defaults.volumeMounts "Override" $config.volumeMounts)) }}

---
# Queue: {{ $queue_name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "banjo.fullname" $ }}-worker-{{ $queue_name }}
  {{- /* Overlay by hand rather than `merge`: mergo skips nil source values, so a
         per-queue `KEY: null` would be dropped before it could unset the default. */ -}}
  {{- $deployAnnotations := deepCopy (default (dict) $defaults.deploymentAnnotations) }}
  {{- range $k, $v := (default (dict) $config.deploymentAnnotations) }}{{- $_ := set $deployAnnotations $k $v -}}{{- end }}
  {{- with (include "banjo.appDefaultDeploymentAnnotations" (dict "Annotations" $deployAnnotations "Context" $)) -}}{{ . | nindent 2 }}{{- end }}
  labels:
    app: {{ include "banjo.fullname" $ }}
    component: worker
    queue: {{ $queue_name }}
    environment: {{ $.Values.environment }}
    release: {{ $.Release.Name }}
spec:
  {{- if not (eq $config.replicaCount nil) }}
  replicas: {{ $config.replicaCount }}
  {{- end }}
  {{- $strategy := $config.strategy | default $defaults.strategy -}}
  {{- with $strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: {{ include "banjo.fullname" $ }}
      component: worker
      queue: {{ $queue_name }}
  template:
    metadata:
      annotations:
        {{- include "banjo.appDefaultAnnotations" $ | nindent 8 }}
        {{- with $defaults.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $config.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app: {{ include "banjo.fullname" $ }}
        component: worker
        queue: {{ $queue_name }}
        {{- with (include "banjo.appDefaultLabels" $) -}}{{ . | nindent 8 }}{{- end }}
    spec:
      {{- with (include "banjo.appDefaultVolumes" (dict "Context" $ "Extra" $extraVolumes)) -}}{{ . | nindent 6 }}{{- end }}
      {{- if $.Values.serviceAccount.create }}
      serviceAccountName: {{ include "banjo.serviceAccountName" $ }}
      {{- end }}
      {{- with (include "banjo.schedulingConfig" (dict "Default" $defaults "Override" $config "Context" $)) -}}{{ . | nindent 6 }}{{- end }}
      {{- $grace := $config.terminationGracePeriodSeconds | default $defaults.terminationGracePeriodSeconds -}}
      {{- with $grace }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      containers:
        - name: worker
          {{- $command := concat (default (list) $defaults.commandPrefix) (default (list) $config.celeryArgs) }}
          command:
            {{- toYaml $command | nindent 12 }}
          {{- include "banjo.imageConfig"
              (dict "Default" $.Values.image "Override" $.Values.worker.image)
              | nindent 10
          }}
          {{- with (include "banjo.probesConfig" (dict "Default" $defaults.probes "Override" $config.probes)) -}}{{ . | nindent 10 }}{{- end }}
          resources:
            {{- include "banjo.resourcesConfig"
                (dict "Default" $defaults.resources "Override" $config.resources)
                | nindent 12
            }}
          envFrom:
            {{- include "banjo.envFromTemplate" $ | nindent 12 }}
          env:
            {{- include "banjo.envTemplate"
                (dict "Values" $.Values "Type" "worker" )
                | nindent 12
            }}
            {{- include "banjo.extraEnvBlock"
                (dict "Default" $defaults "Override" $config "Context" $)
                | nindent 12
            }}
          {{- with (include "banjo.appDefaultVolumeMounts" (dict "Context" $ "Extra" $extraVolumeMounts)) -}}{{ . | nindent 10 }}{{- end }}

{{- end }}

{{- end }}

{{- end }}
