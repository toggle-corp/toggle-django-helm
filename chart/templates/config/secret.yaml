{{- if not .Values.secretsStoreCsiDriver.create -}}

kind: Secret
apiVersion: v1
metadata:
  name: {{ template "banjo.secretname" . }}
  labels:
    app: {{ include "banjo.fullname" . }}
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
type: Opaque
stringData:
  # secrets
  {{- range $name, $value := .Values.secrets }}
  {{ $name }}: {{ tpl $value $ | quote }}
  {{- end }}

{{- end }}
