kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ template "banjo.envConfigMapName" . }}
  labels:
    app: {{ include "banjo.fullname" . }}
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
data:
  # Configs
  {{- range $name, $value := .Values.env }}
  {{ $name }}: {{ tpl $value $ | quote }}
  {{- end }}
