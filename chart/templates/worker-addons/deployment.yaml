{{- if .Values.worker.enabled }}

{{- $defaults := default dict .Values.worker.addonDefaults -}}
{{- include "banjo.assertNoStrayKeys" (dict "Block" $defaults "Path" "worker.addonDefaults" "Fields" (list "annotations") "Hint" "renamed to podAnnotations") -}}
{{- $addons := list -}}
{{- if kindIs "map" .Values.worker.addons -}}
  {{- range $name, $cfg := .Values.worker.addons -}}
    {{- $addons = append $addons (merge (dict "name" $name) (default dict $cfg)) -}}
  {{- end -}}
{{- else if kindIs "slice" .Values.worker.addons -}}
  {{- $addons = .Values.worker.addons -}}
{{- end -}}

{{- range $addon := $addons }}
{{- if $addon.enabled }}
{{- $addon_name := $addon.name }}
{{- include "banjo.assertNoStrayKeys" (dict "Block" $addon "Path" (printf "worker.addons.%s" $addon_name) "Fields" (list "annotations") "Hint" "renamed to podAnnotations") -}}
{{- $extraVolumes := fromYamlArray (include "banjo.namedListConfig" (dict "Default" $defaults.volumes "Override" $addon.volumes)) }}
{{- $extraVolumeMounts := fromYamlArray (include "banjo.namedListConfig" (dict "Default" $defaults.volumeMounts "Override" $addon.volumeMounts)) }}

---
# Addon: {{ $addon_name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "banjo.fullname" $ }}-worker-{{ $addon_name }}
  {{- /* Overlay by hand rather than `merge`: mergo skips nil source values, so a
         per-addon `KEY: null` would be dropped before it could unset the default. */ -}}
  {{- $deployAnnotations := deepCopy (default (dict) $defaults.deploymentAnnotations) }}
  {{- range $k, $v := (default (dict) $addon.deploymentAnnotations) }}{{- $_ := set $deployAnnotations $k $v -}}{{- end }}
  {{- with (include "banjo.appDefaultDeploymentAnnotations" (dict "Annotations" $deployAnnotations "Context" $)) -}}{{ . | nindent 2 }}{{- end }}
  labels:
    app: {{ include "banjo.fullname" $ }}
    component: worker-addon
    addon: {{ $addon_name }}
    environment: {{ $.Values.environment }}
    release: {{ $.Release.Name }}
spec:
  {{- if not (eq $addon.replicaCount nil) }}
  replicas: {{ $addon.replicaCount }}
  {{- end }}
  {{- $strategy := $addon.strategy | default $defaults.strategy -}}
  {{- with $strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: {{ include "banjo.fullname" $ }}
      component: worker-addon
      addon: {{ $addon_name }}
  template:
    metadata:
      annotations:
        {{- include "banjo.appDefaultAnnotations" $ | nindent 8 }}
        {{- with $defaults.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $addon.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app: {{ include "banjo.fullname" $ }}
        component: worker-addon
        addon: {{ $addon_name }}
        {{- with (include "banjo.appDefaultLabels" $) -}}{{ . | nindent 8 }}{{- end }}
    spec:
      {{- with (include "banjo.appDefaultVolumes" (dict "Context" $ "Extra" $extraVolumes)) -}}{{ . | nindent 6 }}{{- end }}
      {{- if $.Values.serviceAccount.create }}
      serviceAccountName: {{ include "banjo.serviceAccountName" $ }}
      {{- end }}
      {{- with (include "banjo.schedulingConfig" (dict "Default" $defaults "Override" $addon "Context" $)) -}}{{ . | nindent 6 }}{{- end }}
      {{- $grace := $addon.terminationGracePeriodSeconds | default $defaults.terminationGracePeriodSeconds -}}
      {{- with $grace }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      containers:
        - name: {{ $addon_name }}
          {{- include "banjo.imageConfig"
              (dict "Default" $.Values.image "Override" $.Values.worker.image)
              | nindent 10
          }}
          {{- with $addon.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $addon.service }}
          {{- if .enabled }}
          ports:
            - name: http
              containerPort: {{ .targetPort }}
              protocol: TCP
          {{- end }}
          {{- end }}
          {{- with (include "banjo.probesConfig" (dict "Default" $defaults.probes "Override" $addon.probes)) -}}{{ . | nindent 10 }}{{- end }}
          resources:
            {{- include "banjo.resourcesConfig"
                (dict "Default" $defaults.resources "Override" $addon.resources)
                | nindent 12
            }}
          envFrom:
            {{- include "banjo.envFromTemplate" $ | nindent 12 }}
          env:
            {{- include "banjo.envTemplate"
                (dict "Values" $.Values "Type" "worker" )
                | nindent 12
            }}
            {{- include "banjo.extraEnvBlock"
                (dict "Default" $defaults "Override" $addon "Context" $)
                | nindent 12
            }}
          {{- with (include "banjo.appDefaultVolumeMounts" (dict "Context" $ "Extra" $extraVolumeMounts)) -}}{{ . | nindent 10 }}{{- end }}

{{- end }}

{{- end }}

{{- end }}
