{{- if .Values.cronjobs.enabled }}

{{- $defaults := default dict .Values.cronjobs.defaults -}}
{{- $jobs := list -}}
{{- if kindIs "map" .Values.cronjobs.jobs -}}
  {{- range $name, $cfg := .Values.cronjobs.jobs -}}
    {{- $jobs = append $jobs (merge (dict "name" $name) (default dict $cfg)) -}}
  {{- end -}}
{{- else if kindIs "slice" .Values.cronjobs.jobs -}}
  {{- $jobs = .Values.cronjobs.jobs -}}
{{- end -}}

{{- range $job := $jobs }}
{{- if $job.enabled }}
{{- $jobName := $job.name }}

---
# Job: {{ $jobName }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ template "banjo.fullname" $ }}-job-{{ $jobName | nospace | lower | replace "_" "-" }}
  labels:
    app: {{ include "banjo.fullname" $ }}
    component: cronjob
    jobName: {{ $jobName }}
    environment: {{ $.Values.environment }}
    release: {{ $.Release.Name }}
spec:
  schedule: {{ $job.schedule | quote }}
  {{- if $job.timeZone }}
  timeZone: {{ $job.timeZone | quote }}
  {{- end }}
  concurrencyPolicy: "Forbid"
  successfulJobsHistoryLimit: {{ default $defaults.successfulJobsHistoryLimit $job.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ default $defaults.failedJobsHistoryLimit $job.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ default 7200 $job.timeLimit }}  # 2 hours default
      {{- with (default $defaults.ttlSecondsAfterFinished $job.ttlSecondsAfterFinished) }}
      ttlSecondsAfterFinished: {{ . }}
      {{- end }}
      template:
        metadata:
          annotations:
            {{- with $.Values.podAnnotations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $defaults.annotations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $job.annotations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          labels:
            app: {{ include "banjo.fullname" $ }}
            component: cronjob
            {{- with (include "banjo.appDefaultLabels" $) -}}{{ . | nindent 12 }}{{- end }}
        spec:
          restartPolicy: "Never"
          {{- with (include "banjo.appDefaultVolumes" $) -}}{{ . | nindent 10 }}{{- end }}
          {{- if $.Values.serviceAccount.create }}
          serviceAccountName: {{ include "banjo.serviceAccountName" $ }}
          {{- end }}
          containers:
            - name: cronjob
              command:
                {{- toYaml $job.command | nindent 16 }}
              {{- include "banjo.imageConfig"
                  (dict "Default" $.Values.image "Override" $defaults.image)
                  | nindent 14
              }}
              resources:
                {{- include "banjo.resourcesConfig"
                    (dict "Default" $defaults.resources "Override" $job.resources)
                    | nindent 16
                }}
              envFrom:
                {{- include "banjo.envFromTemplate" $ | nindent 16 }}
              env:
                {{- include "banjo.envTemplate"
                    (dict "Values" $.Values "Type" "cronjob" )
                    | nindent 16
                }}
                {{- include "banjo.extraEnvBlock"
                    (dict "Default" $defaults "Override" $job "Context" $)
                    | nindent 16
                }}
              {{- with (include "banjo.appDefaultVolumeMounts" $) -}}{{ . | nindent 14 }}{{- end }}

{{- end }}

{{- end }}

{{- end }}
