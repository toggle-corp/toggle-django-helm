suite: Worker Deployment tests
templates:
  - templates/worker/deployment.yaml
  - templates/config/secret.yaml
  - templates/config/configmap.yaml
tests:
  - it: should render one Deployment per enabled queue
    template: templates/worker/deployment.yaml
    set:
      environment: TEST
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queueDefaults:
          commandPrefix: ["celery", "-A", "myapp", "worker", "-l", "INFO"]
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
          heavy:
            enabled: true
            celeryArgs: ["-Q", "heavy"]
          disabled-queue:
            enabled: false
            celeryArgs: ["-Q", "disabled"]
    asserts:
      - hasDocuments:
          count: 2

  - it: should carry argocd sync-wave 30 on the queue Deployment by default
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "30"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"

  - it: should let per-queue deploymentAnnotations override queueDefaults sync-wave
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
            deploymentAnnotations:
              argocd.argoproj.io/sync-wave: "99"
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "99"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"

  - it: should render Deployment with queue label, command prefix + celeryArgs and image
    template: templates/worker/deployment.yaml
    documentSelector:
      path: metadata.labels.queue
      value: default
    set:
      environment: TEST
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queueDefaults:
          commandPrefix: ["celery", "-A", "myapp", "worker", "-l", "INFO"]
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery", "--concurrency", "4"]
    asserts:
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - equal:
          path: metadata.labels.component
          value: worker
      - equal:
          path: metadata.labels.queue
          value: default
      - equal:
          path: metadata.labels.environment
          value: TEST
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - celery
            - -A
            - myapp
            - worker
            - -l
            - INFO
            - -Q
            - celery
            - --concurrency
            - "4"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/example/app:v1"
      - equal:
          path: spec.revisionHistoryLimit
          value: 1

  - it: should use queueDefaults.resources when queue resources not set
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queueDefaults:
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
            resources: {}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "1"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi

  - it: should override image with worker.image
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        image:
          name: ghcr.io/example/worker
          tag: v2
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/example/worker:v2"

  - it: should not render when worker.enabled is false
    template: templates/worker/deployment.yaml
    set:
      worker:
        enabled: false
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when no queues are enabled
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queues:
          default:
            enabled: false
            celeryArgs: ["-Q", "celery"]
    asserts:
      - hasDocuments:
          count: 0

  - it: should render equivalent queue from dict form and array form
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queueDefaults:
          commandPrefix: ["celery", "-A", "myapp", "worker"]
        queues:
          - name: priority
            enabled: true
            celeryArgs: ["-Q", "priority"]
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.labels.queue
          value: priority
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["celery", "-A", "myapp", "worker", "-Q", "priority"]

  - it: should merge queueDefaults.extraEnv with per-queue extraEnv (queue wins)
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queueDefaults:
          commandPrefix: ["celery", "-A", "myapp", "worker"]
          extraEnv:
            SHARED_KEY: "from-defaults"
            LOG_LEVEL: "INFO"
        queues:
          priority:
            enabled: true
            celeryArgs: ["-Q", "priority"]
            extraEnv:
              LOG_LEVEL: "DEBUG"
              QUEUE_KEY: "from-queue"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHARED_KEY
            value: "from-defaults"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: "DEBUG"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUEUE_KEY
            value: "from-queue"

  - it: should coerce non-string extraEnv values (number/boolean) to quoted strings and skip nil
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queueDefaults:
          commandPrefix: ["celery", "-A", "myapp", "worker"]
          extraEnv:
            MAX_RETRIES: 3
            VERBOSE: true
            REMOVED: null
        queues:
          priority:
            enabled: true
            celeryArgs: ["-Q", "priority"]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAX_RETRIES
            value: "3"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VERBOSE
            value: "true"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REMOVED

  - it: should render per-queue volume + mount (dict form, name injected)
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
            volumes:
              celery-heartbeat:
                emptyDir:
                  medium: Memory
                  sizeLimit: 1Mi
            volumeMounts:
              celery-heartbeat:
                mountPath: /var/run/celery
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: celery-heartbeat
            emptyDir:
              medium: Memory
              sizeLimit: 1Mi
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: celery-heartbeat
            mountPath: /var/run/celery

  - it: should concatenate per-queue volumes after global podVolumes
    template: templates/worker/deployment.yaml
    set:
      podVolumes:
        - name: global-vol
          emptyDir: {}
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
            volumes:
              celery-heartbeat:
                emptyDir:
                  medium: Memory
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: global-vol
      - equal:
          path: spec.template.spec.volumes[1].name
          value: celery-heartbeat

  - it: should merge queueDefaults volumes with per-queue volumes (queue wins by name)
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queueDefaults:
          volumes:
            celery-heartbeat:
              emptyDir:
                medium: Memory
                sizeLimit: 1Mi
            shared-cache:
              emptyDir: {}
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
            volumes:
              celery-heartbeat:
                emptyDir:
                  sizeLimit: 8Mi
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: shared-cache
            emptyDir: {}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: celery-heartbeat
            emptyDir:
              medium: Memory
              sizeLimit: 8Mi

  - it: should reset volumes when per-queue volumes given as array (ignores defaults)
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queueDefaults:
          volumes:
            from-defaults:
              emptyDir: {}
        queues:
          - name: priority
            enabled: true
            celeryArgs: ["-Q", "priority"]
            volumes:
              - name: only-this
                emptyDir: {}
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: only-this
            emptyDir: {}
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: from-defaults
            emptyDir: {}

  - it: should not render volumes/volumeMounts when none set and no podVolumes
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      secretsStoreCsiDriver:
        create: false
      worker:
        enabled: true
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  - it: should render probes from queueDefaults.probes when enabled
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queueDefaults:
          probes:
            enabled: true
            liveness:
              exec:
                command:
                  - banjo-celery-probe
                  - --heartbeat-file
                  - /tmp/celery_worker_heartbeat
              periodSeconds: 20
              failureThreshold: 6
            startup:
              exec:
                command:
                  - banjo-celery-probe
                  - --heartbeat-file
                  - /tmp/celery_worker_heartbeat
              periodSeconds: 5
              failureThreshold: 30
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value:
            - banjo-celery-probe
            - --heartbeat-file
            - /tmp/celery_worker_heartbeat
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 6
      - equal:
          path: spec.template.spec.containers[0].startupProbe.exec.command
          value:
            - banjo-celery-probe
            - --heartbeat-file
            - /tmp/celery_worker_heartbeat
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe

  - it: should merge queueDefaults.probes with per-queue probes (queue wins per key)
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queueDefaults:
          probes:
            enabled: true
            liveness:
              exec:
                command: ["banjo-celery-probe"]
              periodSeconds: 20
              failureThreshold: 6
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
            probes:
              liveness:
                failureThreshold: 3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 3
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 20

  - it: should not render probes when probes.enabled is false
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queueDefaults:
          probes:
            enabled: false
            liveness:
              exec:
                command: ["banjo-celery-probe"]
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe

  - it: should not render probes when probes unset
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: should apply queueDefaults.resources with per-queue override (no CPU limit by default)
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queueDefaults:
          commandPrefix: ["celery"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "100m"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "512Mi"
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.cpu

  - it: should render strategy when set on the queue
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
            strategy:
              type: Recreate
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: Recreate

  - it: should let per-queue strategy override queueDefaults strategy wholesale
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queueDefaults:
          strategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
            strategy:
              type: Recreate
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: Recreate
      - notExists:
          path: spec.strategy.rollingUpdate

  - it: should not render strategy when unset
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
    asserts:
      - notExists:
          path: spec.strategy

  - it: should render terminationGracePeriodSeconds when set on the queue
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
            terminationGracePeriodSeconds: 120
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120

  - it: should let per-queue terminationGracePeriodSeconds override queueDefaults
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queueDefaults:
          terminationGracePeriodSeconds: 60
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
            terminationGracePeriodSeconds: 300
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 300

  - it: should fall back to queueDefaults.terminationGracePeriodSeconds when queue unset
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queueDefaults:
          terminationGracePeriodSeconds: 90
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 90

  - it: should not render terminationGracePeriodSeconds when unset
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
    asserts:
      - notExists:
          path: spec.template.spec.terminationGracePeriodSeconds

  - it: should inherit the root nodeSelector when neither queueDefaults nor the queue set one
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      nodeSelector:
        pool: app
      worker:
        enabled: true
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            pool: app

  - it: should let queueDefaults.nodeSelector win over the root nodeSelector
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      nodeSelector:
        pool: app
      worker:
        enabled: true
        queueDefaults:
          nodeSelector:
            pool: worker
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            pool: worker

  - it: should let a per-queue nodeSelector win over both queueDefaults and root
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      nodeSelector:
        pool: app
      worker:
        enabled: true
        queueDefaults:
          nodeSelector:
            pool: worker
        queues:
          heavy:
            enabled: true
            celeryArgs: ["-Q", "heavy"]
            nodeSelector:
              pool: bigmem
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            pool: bigmem

  - it: should resolve each scheduling field independently, not as one block
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      tolerations:
        - key: spot
          operator: Exists
          effect: NoSchedule
      worker:
        enabled: true
        queues:
          heavy:
            enabled: true
            celeryArgs: ["-Q", "heavy"]
            nodeSelector:
              pool: bigmem
    asserts:
      # per-queue nodeSelector applies...
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            pool: bigmem
      # ...without discarding the root tolerations it did not override
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: spot
              operator: Exists
              effect: NoSchedule

  - it: should emit no scheduling fields on queue pods when none are configured
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        queues:
          default:
            enabled: true
            celeryArgs: ["-Q", "celery"]
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations
      - notExists:
          path: spec.template.spec.affinity
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  # worker.image IS read at this level, so worker.nodeSelector looks plausible
  # and would otherwise be a silent no-op — the benchmark reads fine while
  # nothing was actually pinned. Fail loudly instead.
  - it: fails when a scheduling key sits at worker.* instead of worker.queueDefaults.*
    template: templates/worker/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        nodeSelector:
          pool: bench
        queues:
          default:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "worker.nodeSelector is not read by the chart — set it under worker.queueDefaults (queues) or worker.addonDefaults (addons)"
