suite: Worker Addons Deployment tests
templates:
  - templates/worker-addons/deployment.yaml
  - templates/config/secret.yaml
  - templates/config/configmap.yaml
tests:
  - it: should not render anything when worker.addons is empty
    template: templates/worker-addons/deployment.yaml
    set:
      worker:
        enabled: true
        addons: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: should render Deployment per enabled addon (dict form)
    template: templates/worker-addons/deployment.yaml
    set:
      environment: TEST
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        addons:
          beat:
            enabled: true
            command: ["celery", "-A", "myapp", "beat", "-l", "INFO"]
          flower:
            enabled: true
            command: ["celery", "-A", "myapp", "flower"]
          disabled-addon:
            enabled: false
            command: ["something"]
    asserts:
      - hasDocuments:
          count: 2

  - it: should render addon with command, image, and addon label
    template: templates/worker-addons/deployment.yaml
    documentSelector:
      path: metadata.labels.addon
      value: beat
    set:
      environment: TEST
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        addons:
          beat:
            enabled: true
            command: ["celery", "-A", "myapp", "beat", "-l", "INFO"]
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.labels.component
          value: worker-addon
      - equal:
          path: metadata.labels.addon
          value: beat
      - equal:
          path: metadata.labels.environment
          value: TEST
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["celery", "-A", "myapp", "beat", "-l", "INFO"]
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/example/app:v1"
      - equal:
          path: spec.revisionHistoryLimit
          value: 1
      - notExists:
          path: spec.replicas

  - it: should render replicas when addon.replicaCount is set
    template: templates/worker-addons/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        addons:
          beat:
            enabled: true
            command: ["celery"]
            replicaCount: 1
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: should render equivalent addon from array form
    template: templates/worker-addons/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        addons:
          - name: exporter
            enabled: true
            command: ["celery-exporter"]
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.labels.addon
          value: exporter
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["celery-exporter"]

  - it: should merge addonDefaults.extraEnv with per-addon extraEnv
    template: templates/worker-addons/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        addonDefaults:
          extraEnv:
            SHARED: "from-defaults"
        addons:
          beat:
            enabled: true
            command: ["celery"]
            extraEnv:
              ADDON_KEY: "from-addon"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHARED
            value: "from-defaults"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADDON_KEY
            value: "from-addon"

  - it: should ship default resources with memory limit but no CPU limit
    template: templates/worker-addons/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        addons:
          beat:
            enabled: true
            command: ["celery"]
    asserts:
      - isNotNullOrEmpty:
          path: spec.template.spec.containers[0].resources.requests.cpu
      - isNotNullOrEmpty:
          path: spec.template.spec.containers[0].resources.limits.memory
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.cpu

  - it: should render per-addon volume + mount (dict form, name injected)
    template: templates/worker-addons/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        addons:
          beat:
            enabled: true
            command: ["celery"]
            volumes:
              celery-heartbeat:
                emptyDir:
                  medium: Memory
                  sizeLimit: 1Mi
            volumeMounts:
              celery-heartbeat:
                mountPath: /var/run/celery
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: celery-heartbeat
            emptyDir:
              medium: Memory
              sizeLimit: 1Mi
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: celery-heartbeat
            mountPath: /var/run/celery

  - it: should concatenate per-addon volumes after global podVolumes
    template: templates/worker-addons/deployment.yaml
    set:
      podVolumes:
        - name: global-vol
          emptyDir: {}
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        addons:
          beat:
            enabled: true
            command: ["celery"]
            volumes:
              celery-heartbeat:
                emptyDir:
                  medium: Memory
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: global-vol
      - equal:
          path: spec.template.spec.volumes[1].name
          value: celery-heartbeat

  - it: should merge addonDefaults volumes with per-addon volumes (addon wins by name)
    template: templates/worker-addons/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        addonDefaults:
          volumes:
            celery-heartbeat:
              emptyDir:
                medium: Memory
                sizeLimit: 1Mi
            shared-cache:
              emptyDir: {}
        addons:
          beat:
            enabled: true
            command: ["celery"]
            volumes:
              celery-heartbeat:
                emptyDir:
                  sizeLimit: 8Mi
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: shared-cache
            emptyDir: {}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: celery-heartbeat
            emptyDir:
              medium: Memory
              sizeLimit: 8Mi

  - it: should reset volumes when per-addon volumes given as array (ignores defaults)
    template: templates/worker-addons/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        addonDefaults:
          volumes:
            from-defaults:
              emptyDir: {}
        addons:
          - name: exporter
            enabled: true
            command: ["celery-exporter"]
            volumes:
              - name: only-this
                emptyDir: {}
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: only-this
            emptyDir: {}
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: from-defaults
            emptyDir: {}

  - it: should not render volumes/volumeMounts when none set and no podVolumes
    template: templates/worker-addons/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      secretsStoreCsiDriver:
        create: false
      worker:
        enabled: true
        addons:
          beat:
            enabled: true
            command: ["celery"]
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  - it: should render probes from per-addon probes when enabled
    template: templates/worker-addons/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        addons:
          beat:
            enabled: true
            command: ["celery"]
            probes:
              enabled: true
              liveness:
                exec:
                  command:
                    - banjo-celery-probe
                    - --heartbeat-file
                    - /tmp/celery_beat_heartbeat
                    - --max-age
                    - "360"
                failureThreshold: 3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value:
            - banjo-celery-probe
            - --heartbeat-file
            - /tmp/celery_beat_heartbeat
            - --max-age
            - "360"
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 3

  - it: should merge addonDefaults.probes with per-addon probes (addon wins per key)
    template: templates/worker-addons/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        addonDefaults:
          probes:
            enabled: true
            liveness:
              exec:
                command: ["banjo-celery-probe"]
              periodSeconds: 60
              failureThreshold: 3
        addons:
          beat:
            enabled: true
            command: ["celery"]
            probes:
              liveness:
                failureThreshold: 5
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 60

  - it: should not render probes when probes.enabled is false
    template: templates/worker-addons/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        addons:
          beat:
            enabled: true
            command: ["celery"]
            probes:
              enabled: false
              liveness:
                exec:
                  command: ["banjo-celery-probe"]
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe

  - it: should not render probes when probes unset
    template: templates/worker-addons/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      worker:
        enabled: true
        addons:
          beat:
            enabled: true
            command: ["celery"]
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: should not render when worker.enabled is false
    template: templates/worker-addons/deployment.yaml
    set:
      worker:
        enabled: false
        addons:
          beat:
            enabled: true
            command: ["celery"]
    asserts:
      - hasDocuments:
          count: 0
