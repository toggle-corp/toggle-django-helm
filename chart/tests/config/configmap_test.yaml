suite: ConfigMap tests
templates:
  - templates/config/configmap.yaml
tests:
  - it: should render ConfigMap with correct metadata labels and env data (tpl evaluated)
    set:
      environment: TEST
      ingress:
        host: myapp.example.com
      postgresql:
        auth:
          database: "my-app"
      env:
        ENV_1: VALUE_1
        # tpl evaluation from values
        POSTGRES_DB: "{{ .Values.postgresql.auth.database }}"
        INGRESS_HOST: "{{ .Values.ingress.host }}"

    asserts:
      - isKind:
          of: ConfigMap
      - isAPIVersion:
          of: v1
      - isNotEmpty:
          path: metadata.name
      - equal:
          path: metadata.labels.environment
          value: TEST
      - equal:
          path: metadata.labels.release
          value: RELEASE-NAME
      - isNotEmpty:
          path: metadata.labels.app
      - equal:
          path: data.ENV_1
          value: "VALUE_1"
      - equal:
          path: data.POSTGRES_DB
          value: "my-app"
      - equal:
          path: data.INGRESS_HOST
          value: "myapp.example.com"

  - it: should coerce non-string env values (number/boolean) to quoted strings and skip nil
    set:
      environment: TEST
      env:
        PORT: 5432
        DEBUG: true
        RATIO: 1.5
        REMOVED: null
        KEPT: "hello"
    asserts:
      - equal:
          path: data.PORT
          value: "5432"
      - equal:
          path: data.DEBUG
          value: "true"
      - equal:
          path: data.RATIO
          value: "1.5"
      - equal:
          path: data.KEPT
          value: "hello"
      - notExists:
          path: data.REMOVED

  - it: should render large integers in full notation, not scientific
    # Helm parses YAML numbers as float64; Go's %v switches to scientific
    # notation past 1e6, so `toString` would emit "1e+07" for BULK_BATCH_SIZE.
    set:
      environment: TEST
      env:
        BULK_BATCH_SIZE: 10000000
        MAX_UPLOAD_BYTES: 123456789012345
    asserts:
      - equal:
          path: data.BULK_BATCH_SIZE
          value: "10000000"
      - equal:
          path: data.MAX_UPLOAD_BYTES
          value: "123456789012345"

  - it: should render ConfigMap with empty data when env is empty
    set:
      environment: TEST
      env: {}
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.labels.environment
          value: TEST
      - equal:
          path: data
          value: null
