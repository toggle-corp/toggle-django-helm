environment: ALPHA

podLabels:
  azure.workload.identity/use: "true"
podAnnotations:
  aws.workload.identity/use: "true"
  aws.workload.identity/use2: "true"
  aws.workload.identity/use3: "true"

podVolumes:
  - name: my-stuff
    csi:
      driver: "secrets-store.csi.k8s.io"
      readOnly: "true"
      volumeAttributes:
        secretProviderClass: my-secret-provider

podVolumeMounts:
  - name: my-secret
    mountPath: /mnt/secrets-store
    readOnly: true

# Root scheduling: inherited by every pod unless a lower level replaces the field.
# hooks/ pods set nothing below, so they render these verbatim.
nodeSelector:
  pool: app
tolerations:
  - key: dedicated
    operator: Equal
    value: app
    effect: NoSchedule

image:
  name: ghcr.io/example/example
  tag: v1.0.1
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: regcred

api:
  ingress:
    enabled: true
    host: myapp.example.com
    className: nginx
  replicaCount: 0
  resources:
    requests:
      cpu: "0.2"
  # Field set only at component level — root has no topologySpreadConstraints,
  # and the inherited root nodeSelector/tolerations must survive alongside it.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          component: api

worker:
  image:
    name: ghcr.io/example/example
    tag: v1.0.1
  addons:
    beat:
      enabled: true
      command: ["celery", "-A", "myapp", "beat", "-l", "INFO"]
      replicaCount: 1
      strategy:
        type: Recreate
      terminationGracePeriodSeconds: 45
      # Per-addon override; beat is a singleton pinned to the control nodepool.
      nodeSelector:
        pool: control
      # Writer + reader agree on the heartbeat path via this env; the RAM
      # emptyDir below backs it, so the probe needs no --heartbeat-file flag.
      extraEnv:
        BANJO_CELERY_HEARTBEAT_FILE: /var/run/celery/beat_heartbeat
      volumes:
        celery-heartbeat:
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      volumeMounts:
        celery-heartbeat:
          mountPath: /var/run/celery
      probes:
        enabled: true
        liveness:
          exec:
            # --max-age must exceed beat's persistent-scheduler tick (300s).
            command:
              - banjo-celery-probe
              - --max-age
              - "360"
          periodSeconds: 60
          failureThreshold: 3
    flower:
      enabled: true
      command: ["celery", "-A", "myapp", "flower", "--port=8000"]
      service:
        enabled: true
        port: 80
        targetPort: 8000
  queueDefaults:
    commandPrefix: ["celery", "-A", "myapp", "worker", "-l", "INFO"]
    terminationGracePeriodSeconds: 90
    # Middle level replaces the root nodeSelector for every queue.
    nodeSelector:
      pool: worker
    # BANJO_CELERY_HEARTBEAT_FILE points both the worker (writer) and the
    # banjo-celery-probe reader at one path on the RAM emptyDir below, so the
    # probe needs no --heartbeat-file flag.
    extraEnv:
      SHARED_QUEUE_KEY: SHARED_VALUE
      BANJO_CELERY_HEARTBEAT_FILE: /var/run/celery/worker_heartbeat
    volumes:
      celery-heartbeat:
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
    volumeMounts:
      celery-heartbeat:
        mountPath: /var/run/celery
    probes:
      enabled: true
      liveness:
        exec:
          command:
            - banjo-celery-probe
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 6
      startup:
        exec:
          command:
            - banjo-celery-probe
        periodSeconds: 5
        failureThreshold: 30
  queues:
    # NOTE: Make sure keys are lowercase
    default:
      enabled: true
      replicaCount: 0
      celeryArgs: ["-Q", "celery"]
      extraEnv:
        USER_PROXY_SERVER_REF: PROXY_1
        USER_PROXY_SERVER_REF2: PROXY_2
      resources:
        requests:
          cpu: "0.1"
      # Per-queue affinity on top of the inherited queueDefaults nodeSelector.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64

hooks:
  enabled: true
  jobs:
    my-custom-command:
      enabled: true
      useGenerateName: true
      annotations:
        argocd.argoproj.io/hook: "PostSync"
        argocd.argoproj.io/sync-wave: "30"
      command: ["/bin/bash", "-c"]
      extraEnv:
        KEY_1: VALUE_1
        KEY_2: VALUE_2
      args:
        - "date --iso-8601 && ls"
    my-another-custom-command:
      enabled: true
      useGenerateName: true
      annotations:
        argocd.argoproj.io/hook: "PostSync"
        argocd.argoproj.io/sync-wave: "30"
      command: ["/bin/bash", "-c"]
      args:
        - "gdate --iso-8601 && ls"
    run-shell-script:
      enabled: true
      annotations:
        argocd.argoproj.io/hook: "Sync"
        argocd.argoproj.io/sync-wave: "20"
        argocd.argoproj.io/hook-delete-policy: HookSucceeded
      files:
        seed.py: |
          from django.contrib.auth import get_user_model
          User = get_user_model()
          User.objects.get_or_create(username="admin", defaults={"is_superuser": True})
      command: ["sh", "-c", "./manage.py shell < /etc/hook-files/seed.py"]

cronjobs:
  enabled: true
  defaults:
    image:
      name: ghcr.io/example/cronjob
      tag: v1.cronjob
    # Batch pool for every cronjob, replacing the root nodeSelector.
    nodeSelector:
      pool: batch
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
  # NOTE: Application level configuration
  jobs:
    dummy-01:
      enabled: true
      schedule: "0 0 * * *"
      command: ["./manage.py", "run-dummy-command", "01"]
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
    dummy-02:
      enabled: true
      schedule: "0 0 * * *"
      timeZone: "Asia/Kathmandu"
      command: ["./manage.py", "run-dummy-command", "02"]
    dummy-03:
      enabled: false
      schedule: "* * * * *"
      timeZone: "Asia/Kathmandu"
      command: ["./manage.py", "run-dummy-command", "03"]

extraConfigMapName: "my-custom-envs"
env:
  ENV_1: VALUE_1

extraSecretsName: "my-custom-secrets"
secrets:
  POSTGRES_DB: "my-app"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "random-strong-password"
  POSTGRES_HOST: "my-app-postgres"
  POSTGRES_PORT: "5432"
  REDIS_URL: "redis://my-app-redis-master:6379/0"
  AWS_S3_AWS_ENDPOINT_URL: "https://myapp-minio.example.com/"
  AWS_S3_ACCESS_KEY_ID: "minio-user"
  AWS_S3_SECRET_ACCESS_KEY: "random-strong-password"
  AWS_S3_REGION: "us-east-1"
  AWS_S3_BUCKET_STATIC_NAME: static-data
  AWS_S3_BUCKET_MEDIA_NAME: media-data


# Azure configurations
secretsStoreCsiDriver:
  create: true
  parameters:
    usePodIdentity: "false"
    clientID: "sample"
    keyvaultName: "sample"
    tenantId: ""
  secretsKeyMap:
    CACHE_REDIS_URL: CACHE-REDIS-URL
    CELERY_BROKER_URL: CELERY-BROKER-URL

serviceAccountName: ""
serviceAccount:
  create: true
  automountServiceAccountToken: true

extraEnvVars:
  - name: SPECIAL_LEVEL_KEY
    valueFrom:
      configMapKeyRef:
        name: special-config
        key: special.how
