environment: ALPHA

podLabels:
  azure.workload.identity/use: "true"
podAnnotations:
  aws.workload.identity/use: "true"
  aws.workload.identity/use2: "true"
  aws.workload.identity/use3: "true"

podVolumes:
  - name: my-stuff
    csi:
      driver: "secrets-store.csi.k8s.io"
      readOnly: "true"
      volumeAttributes:
        secretProviderClass: my-secret-provider

podVolumeMounts:
  - name: my-secret
    mountPath: /mnt/secrets-store
    readOnly: true

image:
  name: ghcr.io/example/example
  tag: v1.0.1
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: regcred

ingress:
  enabled: true
  host: myapp.example.com
  className: nginx

api:
  replicaCount: 0
  resources:
    requests:
      cpu: "0.2"

worker:
  image:
    name: ghcr.io/example/example
    tag: v1.0.1
  addons:
    beat:
      enabled: true
      command: ["celery", "-A", "myapp", "beat", "-l", "INFO"]
      replicaCount: 1
    flower:
      enabled: true
      command: ["celery", "-A", "myapp", "flower", "--port=8000"]
      service:
        enabled: true
        port: 80
        targetPort: 8000
  queueDefaults:
    commandPrefix: ["celery", "-A", "myapp", "worker", "-l", "INFO"]
    extraEnv:
      SHARED_QUEUE_KEY: SHARED_VALUE
  queues:
    # NOTE: Make sure keys are lowercase
    default:
      enabled: true
      replicaCount: 0
      celeryArgs: ["-Q", "celery"]
      extraEnv:
        USER_PROXY_SERVER_REF: PROXY_1
        USER_PROXY_SERVER_REF2: PROXY_2
      resources:
        requests:
          cpu: "0.1"

argoHook:
  enabled: true
  hooks:
    my-custom-command:
      enabled: true
      hook: PostSync
      preserveHistory: true
      command: ["/bin/bash", "-c"]
      env:
        KEY_1: VALUE_1
        KEY_2: VALUE_2
      args:
        - "date --iso-8601 && ls"
    my-another-custom-command:
      enabled: true
      hook: PostSync
      preserveHistory: true
      command: ["/bin/bash", "-c"]
      args:
        - "gdate --iso-8601 && ls"

cronjobs:
  enabled: true
  defaults:
    image:
      name: ghcr.io/example/cronjob
      tag: v1.cronjob
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
  # NOTE: Application level configuration
  jobs:
    dummy-01:
      enabled: true
      schedule: "0 0 * * *"
      command: ["./manage.py", "run-dummy-command", "01"]
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
    dummy-02:
      enabled: true
      schedule: "0 0 * * *"
      timeZone: "Asia/Kathmandu"
      command: ["./manage.py", "run-dummy-command", "02"]
    dummy-03:
      enabled: false
      schedule: "* * * * *"
      timeZone: "Asia/Kathmandu"
      command: ["./manage.py", "run-dummy-command", "03"]

extraConfigMapName: "my-custom-envs"
env:
  ENV_1: VALUE_1

extraSecretsName: "my-custom-secrets"
secrets:
  POSTGRES_DB: "my-app"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "random-strong-password"
  POSTGRES_HOST: "my-app-postgres"
  POSTGRES_PORT: "5432"
  REDIS_URL: "redis://my-app-redis-master:6379/0"
  AWS_S3_AWS_ENDPOINT_URL: "https://myapp-minio.example.com/"
  AWS_S3_ACCESS_KEY_ID: "minio-user"
  AWS_S3_SECRET_ACCESS_KEY: "random-strong-password"
  AWS_S3_REGION: "us-east-1"
  AWS_S3_BUCKET_STATIC_NAME: static-data
  AWS_S3_BUCKET_MEDIA_NAME: media-data


# Azure configurations
secretsStoreCsiDriver:
  create: true
  parameters:
    usePodIdentity: "false"
    clientID: "sample"
    keyvaultName: "sample"
    tenantId: ""
  secretsKeyMap:
    CACHE_REDIS_URL: CACHE-REDIS-URL
    CELERY_BROKER_URL: CELERY-BROKER-URL

serviceAccountName: ""
serviceAccount:
  create: true
  automountServiceAccountToken: true

extraEnvVars:
  - name: SPECIAL_LEVEL_KEY
    valueFrom:
      configMapKeyRef:
        name: special-config
        key: special.how
