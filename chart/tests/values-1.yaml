environment: ALPHA

image:
  name: ghcr.io/example/example
  tag: v1.0.1

ingress:
  enabled: true
  host: myapp.example.com
  className: nginx
  tls:
    enabled: true
    secretName: my-secret

api:
  resources:
    requests:
      cpu: "0.2"

worker:
  image:
    name: ghcr.io/example/example
    tag: v1.0.1
  addons:
    beat:
      enabled: true
      command: ["celery", "-A", "myapp", "beat", "-l", "INFO"]
      replicaCount: 1
    flower:
      enabled: true
      command: ["celery", "-A", "myapp", "flower", "--port=8000"]
      service:
        enabled: true
        port: 80
        targetPort: 8000
  queueDefaults:
    commandPrefix: ["celery", "-A", "myapp", "worker", "-l", "INFO"]
  queues:
    # NOTE: Make sure keys are lowercase
    default:
      enabled: true
      replicaCount: 1
      celeryArgs: ["-Q", "celery"]
      resources:
        requests:
          cpu: "0.1"

env:
  ENV_1: VALUE_1

secrets:
  POSTGRES_DB: "my-app"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "random-strong-password"
  POSTGRES_HOST: "my-app-postgres"
  POSTGRES_PORT: "5432"
  REDIS_URL: "redis://my-app-redis-master:6379/0"
  AWS_S3_AWS_ENDPOINT_URL: "https://myapp-minio.example.com/"
  AWS_S3_ACCESS_KEY_ID: "minio-user"
  AWS_S3_SECRET_ACCESS_KEY: "random-strong-password"
  AWS_S3_REGION: "us-east-1"
  AWS_S3_BUCKET_STATIC_NAME: static-data
  AWS_S3_BUCKET_MEDIA_NAME: media-data

serviceAccountName: "secret-account"
serviceAccount:
  create: true
  annotations:
    azure.workload.identity/client-id : "XXXXXXXX-YYYYYYYY"
  labels:
    azure.workload.identity/use: "true"
  automountServiceAccountToken: true

extraManifests:
  - apiVersion: postgresql.cnpg.io/v1
    kind: ScheduledBackup
    metadata:
      name: backup-daily
    spec:
      cluster:
        name: pg-cluster
      suspend: false  # Pause this backup
      immediate: true  # Create immediate backup when creating this resource
      schedule: "0 0 0 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io
  - apiVersion: barmancloud.cnpg.io/v1
    kind: ObjectStore
    metadata:
      name: aws-s3-store
    spec:
      retentionPolicy: "30d"
      configuration:
        destinationPath: "s3://my-db-backup/barman/"
        s3Credentials:
          accessKeyId:
            name: barman-s3-creds
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: barman-s3-creds
            key: ACCESS_SECRET_KEY
        wal:
          compression: gzip
          maxParallel: 4
  - apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: pg-cluster
    spec:
      instances: 3
      enablePDB: true
      storage:
        size: 300Mi
      monitoring:
        enablePodMonitor: true
      backup: {}
      plugins:
        - name: barman-cloud.cloudnative-pg.io
          isWALArchiver: true
          parameters:
            barmanObjectName: aws-s3-store
