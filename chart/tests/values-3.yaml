environment: ALPHA

podLabels:
  azure.workload.identity/use: "true"
podAnnotations:
  aws.workload.identity/use: "true"

image:
  name: ghcr.io/example/example
  tag: v1.0.1

ingress:
  enabled: true
  host: myapp.example.com
  className: nginx

api:
  resources:
    requests:
      cpu: "0.2"

worker:
  image:
    name: ghcr.io/example/example
    tag: v1.0.1
  beat:
    resources:
      requests:
        cpu: "0.1"
  flower:
    enabled: true
    resources:
      requests:
        cpu: "0.1"
  queues:
    # NOTE: Make sure keys are lowercase
    default:
      enabled: false
      resources:
        requests:
          cpu: "0.1"

env:
  ENV_1: VALUE_1

secrets:
  POSTGRES_DB: "my-app"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "random-strong-password"
  POSTGRES_HOST: "my-app-postgres"
  POSTGRES_PORT: "5432"
  REDIS_URL: "redis://my-app-redis-master:6379/0"
  AWS_S3_AWS_ENDPOINT_URL: "https://myapp-minio.example.com/"
  AWS_S3_ACCESS_KEY_ID: "minio-user"
  AWS_S3_SECRET_ACCESS_KEY: "random-strong-password"
  AWS_S3_REGION: "us-east-1"
  AWS_S3_BUCKET_STATIC_NAME: static-data
  AWS_S3_BUCKET_MEDIA_NAME: media-data

extraManifests:
  cnpg_backup_schedule:
    apiVersion: postgresql.cnpg.io/v1
    kind: ScheduledBackup
    metadata:
      name: backup-daily
    spec:
      cluster:
        name: pg-cluster
      suspend: false  # Pause this backup
      immediate: true  # Create immediate backup when creating this resource
      schedule: "0 0 0 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io
  cnpg_object_store:
    apiVersion: barmancloud.cnpg.io/v1
    kind: ObjectStore
    metadata:
      name: aws-s3-store
    spec:
      retentionPolicy: "30d"
      configuration:
        destinationPath: "s3://my-db-backup/barman/"
        s3Credentials:
          accessKeyId:
            name: barman-s3-creds
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: barman-s3-creds
            key: ACCESS_SECRET_KEY
        wal:
          compression: gzip
          maxParallel: 4
  cnpg_cluster:
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: pg-cluster
    spec:
      instances: 3
      enablePDB: true
      storage:
        size: 300Mi
      monitoring:
        enablePodMonitor: true
      backup: {}
      plugins:
        - name: barman-cloud.cloudnative-pg.io
          isWALArchiver: true
          parameters:
            barmanObjectName: aws-s3-store
  # Local cache volume
  local-cache-pvc: |
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: my-local-cache
      labels:
        app: {{ include "banjo.fullname" . }}
        environment: {{ .Values.environment }}
        release: {{ .Release.Name }}
    spec:
      storageClassName:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: 2Gi
