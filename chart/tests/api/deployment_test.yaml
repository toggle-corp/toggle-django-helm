suite: API Deployment tests
templates:
  - templates/api/deployment.yaml
  - templates/config/secret.yaml
  - templates/config/configmap.yaml
tests:
  - it: should render Deployment with image, port, command and labels
    template: templates/api/deployment.yaml
    set:
      environment: TEST
      image:
        name: ghcr.io/example/app
        tag: v1.0.0
      api:
        enabled: true
        containerPort: 80
        command: ["/code/deploy/run_prod.sh"]
    asserts:
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - equal:
          path: metadata.labels.environment
          value: TEST
      - equal:
          path: metadata.labels.component
          value: api
      - equal:
          path: metadata.labels.release
          value: RELEASE-NAME
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/example/app:v1.0.0"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 80
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/code/deploy/run_prod.sh"]
      - notExists:
          path: spec.replicas
      - equal:
          path: spec.revisionHistoryLimit
          value: 1

  - it: should override revisionHistoryLimit when set chart-wide
    template: templates/api/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      revisionHistoryLimit: 5
      api:
        enabled: true
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 5

  - it: should set replicas when api.replicaCount is set
    template: templates/api/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      api:
        enabled: true
        replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should override image with api.image
    template: templates/api/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      api:
        enabled: true
        image:
          name: ghcr.io/example/api
          tag: v2
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/example/api:v2"

  - it: should not render when api.enabled is false
    template: templates/api/deployment.yaml
    set:
      api:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should ship resource defaults with memory limit but no CPU limit
    template: templates/api/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      api:
        enabled: true
    asserts:
      - isNotNullOrEmpty:
          path: spec.template.spec.containers[0].resources.requests.cpu
      - isNotNullOrEmpty:
          path: spec.template.spec.containers[0].resources.requests.memory
      - isNotNullOrEmpty:
          path: spec.template.spec.containers[0].resources.limits.memory
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.cpu

  - it: should omit command field when api.command is empty (default)
    template: templates/api/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      api:
        enabled: true
        command: []
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].command

  - it: should merge api.annotations onto pod template metadata
    template: templates/api/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      api:
        enabled: true
        annotations:
          custom.annotation/key: "custom-value"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["custom.annotation/key"]
          value: "custom-value"

  - it: should render api.extraEnv as inline pod env vars
    template: templates/api/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1
      api:
        enabled: true
        extraEnv:
          LOG_LEVEL: DEBUG
          REGION: us-east-1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: "DEBUG"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGION
            value: "us-east-1"

  - it: should tpl-evaluate api.extraEnv values
    template: templates/api/deployment.yaml
    set:
      image:
        name: ghcr.io/example/app
        tag: v1.2.3
      api:
        enabled: true
        extraEnv:
          APP_VERSION: "{{ .Values.image.tag }}"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_VERSION
            value: "v1.2.3"
