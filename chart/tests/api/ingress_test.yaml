suite: API Ingress tests
templates:
  - templates/api/ingress.yaml
tests:
  - it: should render Ingress with host and ingressClassName
    set:
      environment: TEST
      api:
        ingress:
          enabled: true
          host: myapp.example.com
          className: nginx
    asserts:
      - isKind:
          of: Ingress
      - isAPIVersion:
          of: networking.k8s.io/v1
      - equal:
          path: metadata.labels.environment
          value: TEST
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].host
          value: myapp.example.com
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 80
      - notExists:
          path: spec.tls

  - it: should render TLS block when ingress.tls.enabled is true
    set:
      api:
        ingress:
          enabled: true
          host: myapp.example.com
          className: nginx
          tls:
            enabled: true
            secretName: my-tls-secret
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: my-tls-secret
      - equal:
          path: spec.tls[0].hosts[0]
          value: myapp.example.com

  - it: should propagate ingress annotations and labels
    set:
      api:
        ingress:
          enabled: true
          host: myapp.example.com
          className: nginx
          annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "50m"
          labels:
            team: platform
    asserts:
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-body-size"]
          value: "50m"
      - equal:
          path: metadata.labels.team
          value: platform

  - it: should carry argocd sync-wave 30 by default via api.ingress.annotations
    set:
      api:
        ingress:
          enabled: true
          host: myapp.example.com
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "30"

  # helm-unittest `set:` REPLACES the api.ingress.annotations map wholesale (no
  # deep merge), so overriding the wave here drops the default map entirely —
  # only the user-supplied key remains. That's expected.
  - it: should let api.ingress.annotations override the sync-wave wholesale
    set:
      api:
        ingress:
          enabled: true
          host: myapp.example.com
          annotations:
            argocd.argoproj.io/sync-wave: "99"
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "99"

  - it: should tpl-evaluate api.ingress.annotation values against the root context
    set:
      api:
        ingress:
          enabled: true
          host: myapp.example.com
          annotations:
            traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-mw@kubernetescrd"
    asserts:
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          value: NAMESPACE-mw@kubernetescrd

  - it: should render a non-string annotation value as JSON
    set:
      api:
        ingress:
          enabled: true
          host: myapp.example.com
          annotations:
            example.com/port: 8080
            example.com/enabled: true
            example.com/config:
              retries: 3
            example.com/hosts:
              - a
              - b
    asserts:
      - equal:
          path: metadata.annotations["example.com/port"]
          value: "8080"
      - equal:
          path: metadata.annotations["example.com/enabled"]
          value: "true"
      - equal:
          path: metadata.annotations["example.com/config"]
          value: '{"retries":3}'
      - equal:
          path: metadata.annotations["example.com/hosts"]
          value: '["a","b"]'

  - it: should drop an annotation whose value is null
    set:
      api:
        ingress:
          enabled: true
          host: myapp.example.com
          annotations:
            example.com/keep: "yes"
            example.com/drop: null
    asserts:
      - equal:
          path: metadata.annotations["example.com/keep"]
          value: "yes"
      - notExists:
          path: metadata.annotations["example.com/drop"]

  - it: should omit the annotations block when every value is null
    set:
      api:
        ingress:
          enabled: true
          host: myapp.example.com
          annotations:
            argocd.argoproj.io/sync-wave: null
    asserts:
      - notExists:
          path: metadata.annotations

  - it: should not render when ingress.enabled is false
    set:
      api:
        ingress:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should omit ingressClassName when className is unset
    set:
      api:
        ingress:
          enabled: true
          host: myapp.example.com
    asserts:
      - notExists:
          path: spec.ingressClassName
      - equal:
          path: spec.rules[0].host
          value: myapp.example.com

  - it: should omit ingressClassName when className is empty string
    set:
      api:
        ingress:
          enabled: true
          host: myapp.example.com
          className: ""
    asserts:
      - notExists:
          path: spec.ingressClassName
