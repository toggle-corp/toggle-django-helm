environment: ALPHA

image:
  name: ghcr.io/example/example
  tag: v1.0.1
  imagePullPolicy: IfNotPresent

ingress:
  enabled: true
  host: myapp.example.com
  className: nginx

api:
  resources:
    requests:
      cpu: "0.2"

worker:
  image:
    name: ghcr.io/example/example
    tag: v1.0.1
  beat:
    resources:
      requests:
        cpu: "0.1"
  flower:
    enabled: true
    resources:
      requests:
        cpu: "0.1"
  queueDefaults:
    commandPrefix: ["celery", "-A", "myapp", "worker", "-l", "INFO"]
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        memory: "512Mi"
  queues:
    # NOTE: Make sure keys are lowercase
    default:
      enabled: true
      celeryArgs: ["-Q", "celery", "--concurrency", "4"]
      resources:
        requests:
          cpu: "0.1"

argoHook:
  enabled: true
  hooks:
    my-custom-command:
      enabled: true
      hook: PostSync
      preserveHistory: true
      command: ["/bin/bash", "-c"]
      args:
        - "date --iso-8601 && ls"

cronjobs:
  enabled: true
  image:
    name: ghcr.io/example/cronjob
    tag: v1.cronjob
  defaultResources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  # NOTE: Application level configuration
  jobs:
    dummy-01:
      enabled: true
      schedule: "0 0 * * *"
      command: ["./manage.py", "run-dummy-command", "01"]
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
    dummy-02:
      enabled: true
      schedule: "0 0 * * *"
      timeZone: "Asia/Kathmandu"
      command: ["./manage.py", "run-dummy-command", "02"]
    dummy-03:
      enabled: false
      schedule: "* * * * *"
      timeZone: "Asia/Kathmandu"
      command: ["./manage.py", "run-dummy-command", "03"]

extraConfigMapName: "my-custom-envs"
env:
  ENV_1: VALUE_1

extraSecretsName: "my-custom-secrets"
secrets:
  POSTGRES_DB: "my-app"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "random-strong-password"
  POSTGRES_HOST: "my-app-postgres"
  POSTGRES_PORT: "5432"
  REDIS_URL: "redis://my-app-redis-master:6379/0"
  AWS_S3_AWS_ENDPOINT_URL: "https://myapp-minio.example.com/"
  AWS_S3_ACCESS_KEY_ID: "minio-user"
  AWS_S3_SECRET_ACCESS_KEY: "random-strong-password"
  AWS_S3_REGION: "us-east-1"
  AWS_S3_BUCKET_STATIC_NAME: static-data
  AWS_S3_BUCKET_MEDIA_NAME: media-data


extraEnvVars:
  - name: SPECIAL_LEVEL_KEY
    valueFrom:
      configMapKeyRef:
        name: special-config
        key: special.how
  - name: SPECIAL_LEVEL_KEY_FROM_SECRETS
    valueFrom:
      secretKeyRef:
        name: special-secret
        key: special.how
