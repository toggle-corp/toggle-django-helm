environment: PROD

appTypeEnvName: "DJANGO_APP_TYPE"

# Number of old ReplicaSets retained per Deployment for rollback (k8s default is 10).
# Applies chart-wide to every Deployment the chart renders.
revisionHistoryLimit: 1

# Applied to every resource the chart renders (Deployments, CronJob, hook Jobs,
# Ingress, Services, ConfigMap, Secret, ServiceAccount, SecretProviderClass) on
# the object's own metadata — NOT the pod template. Component-level keys
# (`api.deploymentAnnotations`, `cronjobs.defaults.cronjobAnnotations`,
# `hooks.*.jobAnnotations`, `api.ingress.annotations`, `serviceAccount.annotations`)
# overlay these key-wise, and a `KEY: null` at either level drops the entry.
# Values follow the `api.ingress.annotations` contract below.
#
# Does not reach `extraManifests` — those render verbatim.
commonAnnotations: {}

# Applied to every pod template the chart renders. Per-component `podAnnotations`
# overlay these key-wise, and a component-level `KEY: null` drops an entry set
# here. Values follow the `api.ingress.annotations` contract below: strings are
# tpl-evaluated, non-strings render as JSON, `KEY: null` drops the key.
#
# An ArgoCD sync-wave here would be inert — put it in commonAnnotations above
# (the chart fails fast if you get this wrong). Same for every per-component
# `podAnnotations`, which point at that component's resource-level key.
podLabels: {}
podAnnotations: {}
podVolumes: []
podVolumeMounts: []

# Pod scheduling — constrains WHERE pods may run. Applies chart-wide to every pod
# the chart renders (api, worker queues, worker addons, cronjobs, hook jobs).
#
# All four are passthrough — rendered verbatim under the matching podSpec field,
# so any valid k8s value works. NOT tpl-evaluated (unlike env/annotations): these
# are cluster topology facts, so `{{ ... }}` is not expanded here.
#
# Resolution is PER FIELD and REPLACE-ONLY (never merged), lowest level wins:
#   per-item (queue/addon/job)  ->  component defaults  ->  these root values
# Each field resolves on its own: setting `nodeSelector` on a queue does not
# discard the root `tolerations`. But a value that IS set replaces the inherited
# one wholesale — to add one label on top of a root selector, repeat the root
# labels in the override.
#
# The nearest level that MENTIONS a field wins, so an explicitly empty value
# clears the inherited one — `tolerations: []` under `cronjobs.defaults` keeps
# batch jobs off a tainted pool the root admits them to. (Only across different
# key paths, as here. Re-stating a key at its OWN path in a later `-f` file
# cannot empty it: Helm coalesces maps and strips nulls — helm/helm#9136.)
#
# HOOK JOBS INHERIT ONLY nodeSelector AND tolerations FROM ROOT.
# Those are permissive, and withholding them is what deadlocks a sync: a root
# toleration for a tainted nodepool that hooks ignored leaves db-migrate
# (sync-wave 20) permanently Pending, blocking api/worker at wave 30.
# `affinity` and `topologySpreadConstraints` are restrictive, and hook pods
# carry the same `app: <fullname>` label as api/worker — so inheriting the
# canonical HA podAntiAffinity rule would bar db-migrate from every node
# already running an app pod, causing that same deadlock. Set either field
# under `hooks.defaults` / `hooks.jobs.<name>` to opt in deliberately.
#
# Overridable at: api.*, worker.queueDefaults.* / worker.queues.<name>.*,
# worker.addonDefaults.* / worker.addons.<name>.*,
# cronjobs.defaults.* / cronjobs.jobs.<name>.*,
# hooks.defaults.* / hooks.jobs.<name>.*
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

image: {}
  # name:
  # tag:
  # imagePullPolicy: IfNotPresent
  # imagePullSecrets:

api:
  # Not required if root image are set
  image: {}
    # name: API-SET-BY-CICD-IMAGE
    # tag: API-SET-BY-CICD-TAG
    # imagePullPolicy: IfNotPresent
    # imagePullSecrets:
  enabled: true
  containerPort: 80
  ingress:
    enabled: false
    host:
    # Optional. If unset, the cluster's default IngressClass is used.
    className:
    # Ingress resource-level annotations (rendered on Ingress.metadata.annotations).
    # Defaulted to the ArgoCD sync-wave so the ingress comes up with the app
    # workloads (wave 30); see the `hooks.jobs` wave contract below. Override to
    # add ingress-controller annotations.
    #
    # Values: a string is tpl-evaluated against the root context (so
    # `{{ .Release.Namespace }}` works, and a literal `{{` fails the render);
    # anything else renders as JSON. Either way the value lands as the string
    # k8s requires. `KEY: null` drops the key, and the whole `annotations:`
    # stanza is omitted once nothing is left.
    annotations:
      argocd.argoproj.io/sync-wave: "30"
    tls:
      enabled: false
      secretName:
  # Set to your application's entrypoint; empty by default to keep the chart
  # un-opinionated about Toggle Corp's deploy/run_prod.sh convention.
  command: []
  # Resource-level annotations merged onto Deployment.metadata.annotations
  # (the Deployment object itself, NOT the pod template). Defaulted to the
  # ArgoCD sync-wave; the reloader annotation is added by the chart. Keys here
  # win over the reloader default. See the `hooks.jobs` wave contract below.
  # Values follow the same contract as `api.ingress.annotations` above: strings
  # are tpl-evaluated, non-strings render as JSON, `KEY: null` drops the key.
  deploymentAnnotations:
    argocd.argoproj.io/sync-wave: "30"
  # Per-component annotations merged into the pod template
  # (spec.template.metadata.annotations), NOT the Deployment resource. A
  # sync-wave here would be inert — put it in deploymentAnnotations above.
  podAnnotations: {}
  # Per-component inline env. A string value is tpl-evaluated, any other value
  # renders as JSON — the same contract as the `env:` block below. Layered on top
  # of the global env: ConfigMap (envFrom) — item entries override global on key
  # conflict.
  # A per-item `KEY: null` drops the key rather than overriding it, so an item
  # can opt out of a var its component defaults set.
  extraEnv: {}
  # Pod scheduling for the api pods only. Replaces the root value per field;
  # see the root `nodeSelector` block for the full contract.
  # nodeSelector: {}
  # tolerations: []
  # affinity: {}
  # topologySpreadConstraints: []
  # No replicaCount default — KEDA owns scaling. Set api.replicaCount: N for
  # a static count or temporary manual bumps.
  lifecycle:
    # preStop sleep closes the kube-proxy endpoint-propagation race: SIGTERM
    # and endpoint removal happen concurrently, so a pod can still receive
    # new requests after uvicorn stops accepting them. Sleeping before
    # SIGTERM gives kube-proxy time to drop the pod from Service endpoints.
    # See: https://learnk8s.io/graceful-shutdown
    # Set to 0 to disable the hook entirely.
    # Uses K8s 1.30+ native lifecycle.sleep action (kubeVersion-pinned).
    preStopSleepSeconds: 8
  # Effective spec.terminationGracePeriodSeconds = preStopSleepSeconds + 30s
  # drain budget, unless this is set explicitly (then this value wins).
  # Leave unset to take the computed default.
  # terminationGracePeriodSeconds:
  probes:
    # Opt-in. Requires the app to expose HTTP health endpoints.
    # See banjo-utils' HealthCheckMiddleware for the conventional
    # /healthz/live/ and /healthz/ready/ implementation:
    # https://github.com/toggle-corp/banjo-utils#health-endpoints
    #
    # Passthrough schema: each probe block is rendered verbatim under
    # the matching k8s Probe field, so any field of corev1.Probe is
    # configurable here. To turn the whole feature off, set enabled: false.
    # To disable a single probe, use `--set api.probes.<probe>=null` on the
    # CLI; Helm deep-merges -f overlays, so writing `startup: {}` or
    # `startup: null` in a values file does NOT clear the defaults
    # (helm/helm#9136). Same for switching handler (httpGet -> tcpSocket):
    # use `--set api.probes.<probe>.httpGet=null` and add the new handler.
    enabled: false
    # Liveness — restart on wedge. Conservative: 120s wedge budget
    # (20s period × 6 failures) tolerates GC pauses without nuking pods.
    liveness:
      httpGet:
        path: /healthz/live/
        port: http
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 6
    # Readiness — pull from Service endpoints on dependency loss.
    # Aggressive vs liveness: 60s budget (10s × 6). Endpoint flap is cheap.
    # banjo-utils' /healthz/ready/ is deliberately pod-local (no DB/Redis
    # probing) to avoid stampeding shared deps on recovery.
    readiness:
      httpGet:
        path: /healthz/ready/
        port: http
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 6
    # Startup — long-tail boot grace before liveness arms. 150s budget
    # (5s × 30) covers cold Django boot. Mirrors readiness path so the
    # same banjo-utils endpoint serves both (pod-local check by design).
    startup:
      httpGet:
        path: /healthz/ready/
        port: http
      periodSeconds: 5
      failureThreshold: 30
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      # No CPU limit — CFS throttling hurts p99 latency without preventing harm.
      memory: "512Mi"

worker:
  # Not required if root image are set
  image: {}
    # name: WORKER-SET-BY-CICD-IMAGE
    # tag: WORKER-SET-BY-CICD-TAG
    # imagePullPolicy: IfNotPresent
    # imagePullSecrets:
  enabled: true
  # Defaults applied to each queue worker unless overridden per-queue.
  queueDefaults:
    commandPrefix: []
      # - "celery"
      # - "-A"
      # - "myapp"
      # - "worker"
      # - "-l"
      # - "INFO"
    # Resource-level annotations on the worker Deployment object (NOT the pod
    # template). Defaulted to the ArgoCD sync-wave; per-queue
    # deploymentAnnotations win per key, and a per-queue `KEY: null` drops the
    # key rather than shadowing it. See the `hooks.jobs` wave contract below.
    # Values follow the `api.ingress.annotations` contract above.
    deploymentAnnotations:
      argocd.argoproj.io/sync-wave: "30"
    # Per-component annotations merged into the pod template
    # (spec.template.metadata.annotations), NOT the Deployment resource. A
    # sync-wave here would be inert — put it in deploymentAnnotations above.
    podAnnotations: {}
    # Deployment update strategy. Whole-block override (coalesced, NOT merged):
    # a per-queue strategy replaces this entirely. Singletons (e.g. beat) should
    # set `{type: Recreate}` to never run two pods during a rollout.
    strategy: {}
    # Celery warm-shutdown drain budget on SIGTERM; size to the longest task;
    # k8s default 30s when unset.
    # terminationGracePeriodSeconds: 60
    #
    # Pod scheduling for every queue; a per-queue value replaces this per field.
    # See the root `nodeSelector` block for the full contract.
    # nodeSelector: {}
    # tolerations: []
    # affinity: {}
    # topologySpreadConstraints: []
    #
    # banjo-utils worker liveness/startup probe, shared by every queue. One env
    # points both the writer (setup_worker_heartbeat bootstep) and the reader
    # (banjo-celery-probe) at a heartbeat file on a RAM emptyDir — no
    # --heartbeat-file flag, no disk writes (works with readOnlyRootFilesystem).
    # See https://github.com/toggle-corp/banjo-utils#celery-worker--beat-health
    # Disable one probe with `--set ...probes.<probe>=null`; `{}`/`null` in a
    # -f overlay does NOT clear it (helm/helm#9136). Uncomment to enable:
    # extraEnv:
    #   BANJO_CELERY_HEARTBEAT_FILE: /var/run/celery/worker_heartbeat
    # volumes:
    #   celery-heartbeat: {emptyDir: {medium: Memory, sizeLimit: 1Mi}}
    # volumeMounts:
    #   celery-heartbeat: {mountPath: /var/run/celery}
    # probes:
    #   enabled: true
    #   liveness:    # restart on wedge — 120s budget (20s x 6)
    #     exec: {command: [banjo-celery-probe]}
    #     periodSeconds: 20
    #     timeoutSeconds: 5
    #     failureThreshold: 6
    #   startup:     # boot grace — 150s budget (5s x 30)
    #     exec: {command: [banjo-celery-probe]}
    #     periodSeconds: 5
    #     failureThreshold: 30
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        # No CPU limit by chart convention.
        memory: "512Mi"
  # Map of queue name → per-queue spec. Set as a dict to merge with defaults
  # via -f overlay; set as an array to wholesale reset.
  # NOTE: Make sure keys are lowercase.
  # Uncomment a queue and set its -Q; the heartbeat probe is inherited from
  # queueDefaults above (per-queue keys override the defaults per key).
  queues: {}
    # default:
    #   enabled: true
    #   # replicaCount: 1     # omit to let KEDA scale; set for static count
    #   celeryArgs: ["-Q", "celery", "--concurrency", "4", "--max-tasks-per-child", "10"]
    #   # extraEnv: {}        # merged onto queueDefaults.extraEnv (per-queue wins)
    #   # podAnnotations: {}
    #   # resources: {}

  # Defaults applied to each worker addon (beat, flower, exporters, etc.).
  addonDefaults:
    extraEnv: {}
    # Resource-level annotations on the addon Deployment object (NOT the pod
    # template). Defaulted to the ArgoCD sync-wave; per-addon
    # deploymentAnnotations win per key, and a per-addon `KEY: null` drops the
    # key rather than shadowing it. See the `hooks.jobs` wave contract below.
    # Values follow the `api.ingress.annotations` contract above.
    deploymentAnnotations:
      argocd.argoproj.io/sync-wave: "30"
    # Per-component annotations merged into the pod template
    # (spec.template.metadata.annotations), NOT the Deployment resource. A
    # sync-wave here would be inert — put it in deploymentAnnotations above.
    podAnnotations: {}
    # Pod volumes / container mounts. Dict to merge by name, array to reset.
    volumes: {}
    volumeMounts: {}
    # Deployment update strategy. Whole-block override (coalesced, NOT merged):
    # a per-addon strategy replaces this entirely. Singletons (e.g. beat) should
    # set `{type: Recreate}` to never run two pods during a rollout.
    strategy: {}
    # Celery warm-shutdown drain budget on SIGTERM; size to the longest task; k8s default 30s when unset.
    # terminationGracePeriodSeconds: 60
    # Pod scheduling for every addon; a per-addon value replaces this per field.
    # See the root `nodeSelector` block for the full contract.
    # nodeSelector: {}
    # tolerations: []
    # affinity: {}
    # topologySpreadConstraints: []
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        memory: "256Mi"
  # Auxiliary worker processes (beat, flower, celery-exporter, custom singletons).
  # Each addon is a Deployment; optional Service via service.enabled.
  # Set as a dict to merge with defaults via -f overlay; set as an array to reset.
  # Complete copy-paste beat example: uncomment the `beat:` block and set your
  # app module in `command`. Beat is a singleton (strategy: Recreate) with its
  # own banjo-celery-probe heartbeat file, distinct from the workers'.
  addons: {}
    # beat:
    #   enabled: true
    #   command: ["celery", "-A", "myapp", "beat", "-l", "INFO"]
    #   replicaCount: 1                # beat must stay a singleton
    #   strategy: {type: Recreate}     # never run two beats during a rollout
    #   terminationGracePeriodSeconds: 30
    #   extraEnv:
    #     BANJO_CELERY_HEARTBEAT_FILE: /var/run/celery/beat_heartbeat
    #   volumes:
    #     celery-heartbeat: {emptyDir: {medium: Memory, sizeLimit: 1Mi}}
    #   volumeMounts:
    #     celery-heartbeat: {mountPath: /var/run/celery}
    #   probes:
    #     enabled: true
    #     liveness:    # --max-age must exceed beat's persistent-scheduler tick (300s)
    #       exec: {command: [banjo-celery-probe, --max-age, "360"]}
    #       periodSeconds: 60
    #       timeoutSeconds: 5
    #       failureThreshold: 3
    #
    # flower:
    #   enabled: false
    #   command: ["celery", "-A", "myapp", "flower", "--port=8000"]
    #   service:
    #     enabled: true
    #     port: 80
    #     targetPort: 8000
    #
    # celery-exporter:
    #   enabled: false
    #   command: ["celery-exporter"]
    #   service:
    #     enabled: true
    #     port: 9808
    #     targetPort: 9808

cronjobs:
  enabled: true
  defaults:
    image: {}
      # name: CRONJOB-SET-BY-CICD-IMAGE
      # tag: CRONJOB-SET-BY-CICD-TAG
      # imagePullPolicy: IfNotPresent
      # imagePullSecrets:
    extraEnv: {}
    # Pod-level annotations, applied to the CronJob's job pods. A sync-wave here
    # would be inert — put it in cronjobAnnotations below (the chart fails fast
    # if you get this wrong).
    podAnnotations: {}
    # Resource-level annotations, applied to the CronJob object itself. A per-job
    # `cronjobAnnotations` map merges key-wise over this one, and a per-job
    # `KEY: null` drops the key rather than shadowing it. Values follow the
    # `api.ingress.annotations` contract above.
    #
    # Defaulted to the ArgoCD sync-wave so CronJobs are only applied once the
    # wave-10/20 hooks have succeeded. NOTE: the wave defers when ArgoCD
    # *applies* the CronJob; it does not suspend one that is already applied.
    # During a wave-20 migration the previous image can still fire, so migrations
    # must stay backward-compatible with the N-1 image — the same constraint api
    # lives under during a rolling update.
    #
    # `-f` overlays and `--set` deep-merge into this map rather than replacing
    # it: an unrelated key leaves the wave intact, and `cronjobAnnotations: {}`
    # does NOT clear it. To drop the wave, null that key explicitly in an overlay
    # (`argocd.argoproj.io/sync-wave: null`); the whole `annotations:` stanza is
    # omitted once nothing is left.
    cronjobAnnotations:
      argocd.argoproj.io/sync-wave: "30"
    # Default k8s CronJob keeps 3 successful + 1 failed. Tighten by default.
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
    # Age-based GC of finished Jobs (and their pods) via Job TTL controller.
    # Defaults to 7 days. Set to null here to disable globally and fall back to
    # the count-based history limits above. (Helm strips null leaves on merge,
    # so a per-job null inherits this default rather than disabling — disable
    # globally here, then opt specific jobs back in with a positive override.)
    ttlSecondsAfterFinished: 604800  # 7 days
    # Pod scheduling for every cronjob; a per-job value replaces this per field.
    # See the root `nodeSelector` block for the full contract.
    # nodeSelector: {}
    # tolerations: []
    # affinity: {}
    # topologySpreadConstraints: []
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        memory: "512Mi"
  # NOTE: Application level configuration.
  # Set as a dict to merge with chart defaults via -f overlay; set as an array to reset.
  jobs: {}
    # dummy:
    #   schedule: "0 0 * * *"
    #   timeZone: "Asia/Kathmandu"
    #   enabled: false
    #   extraEnv: {}
    #   podAnnotations: {}
    #   # Resource-level; merges key-wise over cronjobs.defaults.cronjobAnnotations,
    #   # so the inherited sync-wave survives unless you name that key here.
    #   cronjobAnnotations:
    #     example.com/owner: "data-platform"
    #   # Per-job overrides — fall back to cronjobs.defaults.* when unset.
    #   successfulJobsHistoryLimit: 1
    #   failedJobsHistoryLimit: 1
    #   ttlSecondsAfterFinished: 3600  # positive value overrides the 7-day default
    #   command: ["./manage.py", "run-dummy-command"]

# Hook Jobs (ArgoCD or Helm). Annotations are passed through verbatim;
# consumer writes either argocd.argoproj.io/* (default) or helm.sh/* — same template.
hooks:
  enabled: true
  defaults:
    # Not required if root image are set
    image: {}
      # name: HOOK-SET-BY-CICD-IMAGE
      # tag: HOOK-SET-BY-CICD-TAG
      # imagePullPolicy: IfNotPresent
      # imagePullSecrets:
    extraEnv: {}
    # Resource-level annotations on every hook Job object. A per-job
    # `jobAnnotations` map merges key-wise over this one, per-job winning, and a
    # per-job `KEY: null` drops the key. This is where the ArgoCD hook and
    # sync-wave annotations belong. Values follow the `api.ingress.annotations`
    # contract above.
    jobAnnotations: {}
    # Pod-level annotations, applied to every hook Job's pod. A sync-wave here
    # would be inert — put it in jobAnnotations above (the chart fails fast if
    # you get this wrong).
    podAnnotations: {}
    # Pod scheduling for every hook job; a per-job value replaces this per field.
    # See the root `nodeSelector` block for the full contract. Hooks are the one
    # exception to root inheritance: they pick up root nodeSelector/tolerations,
    # but affinity/topologySpreadConstraints ONLY from here or a per-job value —
    # a root podAntiAffinity on the shared `app` label would strand db-migrate.
    # nodeSelector: {}
    # tolerations: []
    # affinity: {}
    # topologySpreadConstraints: []
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        memory: "512Mi"
  # Set as a dict to merge with chart defaults via -f overlay; set as an array to reset.
  #
  # ArgoCD startup ordering (the wave contract — keep in sync with banjo-alpha-deps):
  #   wave 0  : deps (tcpg, dragonfly, minio) — regular Sync resources, gated by their
  #             own readiness probes. ArgoCD waits for the whole wave to be Healthy
  #             before the next wave, so nothing here needs a sync-wave annotation.
  #   wave 10 : wait-for-resources — app-side config/connectivity validation.
  #   wave 20 : db-migrate, collect-static — schema + static, run only after deps healthy.
  #   wave 30 : api, worker, beat, ingress, cronjobs — set via the resource-level
  #             `argocd.argoproj.io/sync-wave` default on `api.deploymentAnnotations`,
  #             `worker.queueDefaults.deploymentAnnotations`,
  #             `worker.addonDefaults.deploymentAnnotations`, `api.ingress.annotations`,
  #             and `cronjobs.defaults.cronjobAnnotations`. For cronjobs the wave only
  #             defers when the CronJob is *applied* — it does not suspend one that is
  #             already applied, so a pre-existing CronJob can still fire the previous
  #             image during a wave-20 migration.
  # Hooks are `hook: Sync` (NOT PreSync — PreSync runs before deps are even applied and
  # would deadlock on bootstrap; NOT PostSync — that runs after api is already serving).
  jobs:
    # NOTE: Make sure keys are lowercase.
    wait-for-resources:
      enabled: true  # gate for api/worker; requires https://github.com/toggle-corp/banjo-utils
      jobAnnotations:
        argocd.argoproj.io/hook: "Sync"
        argocd.argoproj.io/sync-wave: "10"
        argocd.argoproj.io/hook-delete-policy: HookSucceeded
      command: ["./manage.py", "wait_for_resources"]
    db-migrate:
      enabled: true
      # useGenerateName: true keeps prior migration history (each sync = unique name).
      # NOTE: do NOT add argocd.argoproj.io/hook-delete-policy with useGenerateName —
      # BeforeHookCreation matches by name and is inert here (ArgoCD docs).
      # Cleanup is handled k8s-native via ttlSecondsAfterFinished below.
      useGenerateName: true
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800  # 7 days
      jobAnnotations:
        argocd.argoproj.io/hook: "Sync"
        argocd.argoproj.io/sync-wave: "20"
      command: ["./manage.py", "migrate"]
    collect-static:
      enabled: true
      jobAnnotations:
        argocd.argoproj.io/hook: "Sync"
        argocd.argoproj.io/sync-wave: "20"
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
      command: ["./manage.py", "collectstatic", "--noinput"]
    # Mount inline script content as files and pipe one into a shell. Each key
    # under `files` becomes a file at `filesMountPath` (default /etc/hook-files),
    # rendered into a per-job ConfigMap that inherits this job's hook + sync-wave
    # annotations (delete-policy forced to BeforeHookCreation so content is fresh
    # every sync). stdin redirection needs a shell, so wrap the command yourself
    # with `sh -c` and reference the mounted path — the chart does not do this for
    # you. File keys must match [-._a-zA-Z0-9]+ and filesMountPath must be absolute.
    # run-shell-script:
    #   enabled: false
    #   jobAnnotations:
    #     argocd.argoproj.io/hook: "Sync"
    #     argocd.argoproj.io/sync-wave: "20"
    #     argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    #   filesMountPath: /etc/hook-files  # default; override if it collides with the image
    #   files:
    #     seed.py: |
    #       from django.contrib.auth import get_user_model
    #       User = get_user_model()
    #       User.objects.get_or_create(username="admin", defaults={"is_superuser": True})
    #   command: ["sh", "-c", "./manage.py shell < /etc/hook-files/seed.py"]

# Both `env` and `secrets` below become k8s objects consumed via envFrom, and
# share one value contract:
#   - String values are tpl-evaluated, so they can reference release data.
#   - Non-strings are JSON-encoded, then quoted (k8s env values must be strings).
#     Numbers keep their full notation — 10000000 arrives as "10000000".
#   - A null value OMITS THE KEY ENTIRELY. This is the standard Helm idiom for
#     removing an inherited key, but note that envFrom has no way to signal it:
#     the container simply starts without the variable, and the app fails at
#     first use rather than at render. Set "" for an intentionally empty value.
extraConfigMapName: ""  # User provided name
envConfigMapName: ""
env: {}

extraSecretsName: ""  # User provided name
secretsName: ""
secrets: {}
  # # Wire infrastructure connection strings here. Values are tpl-evaluated.
  # # Postgres / Redis / S3 should be deployed via a separate infrastructure chart.
  # POSTGRES_DB: "my-app"
  # POSTGRES_USER: "postgres"
  # POSTGRES_PASSWORD: "set-via-extraSecretsName-or-external-secret"
  # POSTGRES_HOST: "my-app-postgres"
  # POSTGRES_PORT: "5432"
  # REDIS_URL: "redis://my-app-redis-master:6379/0"
  # AWS_S3_ENDPOINT_URL: "https://my-app-minio.example.com/"
  # AWS_S3_REGION: "us-east-1"
  # AWS_S3_BUCKET_STATIC_NAME: static-data
  # AWS_S3_BUCKET_MEDIA_NAME: media-data

serviceAccountName: ""
serviceAccount:
  create: false
  annotations: {}
  labels: {}
  automountServiceAccountToken: true

# Azure configurations
secretsStoreCsiDriverProviderName: ""
secretsStoreCsiDriver:
  create: false
  provider: azure  # Only azure is supported
  parameters:
    usePodIdentity: "false"
    clientID: ""
    keyvaultName: ""
    tenantId: ""
  secretsKeyMap: {}  # k8s Secret Key -> VaultKey

# extraManifests: [] or {}
