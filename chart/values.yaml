environment: PROD

appTypeEnvName: "DJANGO_APP_TYPE"

# Number of old ReplicaSets retained per Deployment for rollback (k8s default is 10).
# Applies chart-wide to every Deployment the chart renders.
revisionHistoryLimit: 1

podLabels: {}
podAnnotations: {}
podVolumes: []
podVolumeMounts: []

image: {}
  # name:
  # tag:
  # imagePullPolicy: IfNotPresent
  # imagePullSecrets:

ingress:
  enabled: false
  host:
  className:
  tls:
    enabled: false
    secretName:

api:
  # Not required if root image are set
  image: {}
    # name: WORKER-SET-BY-CICD-IMAGE
    # tag: WORKER-SET-BY-CICD-TAG
    # imagePullPolicy: IfNotPresent
    # imagePullSecrets:
  enabled: true
  containerPort: 80
  command: ["/code/deploy/run_prod.sh"]
  resources:
    requests:
      cpu: "2"
      memory: 0.5Gi
    limits:
      cpu: "2"
      memory: 1Gi

worker:
  # Not required if root image are set
  image: {}
    # name: WORKER-SET-BY-CICD-IMAGE
    # tag: WORKER-SET-BY-CICD-TAG
    # imagePullPolicy: IfNotPresent
    # imagePullSecrets:
  enabled: true
  beat:
    enabled: false
    image: {}
      # name: WORKER-SET-BY-CICD-IMAGE
      # tag: WORKER-SET-BY-CICD-TAG
      # imagePullPolicy: IfNotPresent
      # imagePullSecrets:
    command: ["celery", "-A", "myapp", "beat", "-l", "INFO"]
    resources:
      requests:
        cpu: "1"
        memory: 0.5Gi
      limits:
        cpu: "1"
        memory: 1Gi
  flower:
    image: {}
      # name: WORKER-SET-BY-CICD-IMAGE
      # tag: WORKER-SET-BY-CICD-TAG
      # imagePullPolicy: IfNotPresent
      # imagePullSecrets:
    enabled: false  # Install flower package first
    command: ["celery", "-A", "myapp", "flower", "--port=8000"]
    resources:
      requests:
        cpu: "0.1"
        memory: 0.5Gi
      limits:
        cpu: "1"
        memory: 1Gi
  queueDefaultResources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  queueCommandPrefix:
    - "celery"
    - "-A"
    - "myapp"
    - "worker"
    - "-l"
    - "INFO"
  queues:
    # NOTE: Make sure keys are lowercase
    default:
      enabled: true
      celeryArgs:
        - "-Q"
        - "celery"
        - "--concurrency"
        - "4"
        - "--max-tasks-per-child"
        - "10"
      resources: {}
        # requests:
        #   cpu: "1"
        #   memory: 1Gi
        # limits:
        #   cpu: "1"
        #   memory: 2Gi

cronjobs:
  enabled: true
  image: {}
    # name: CRONJOB-SET-BY-CICD-IMAGE
    # tag: CRONJOB-SET-BY-CICD-TAG
    # imagePullPolicy: IfNotPresent
    # imagePullSecrets:
  defaultResources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  # NOTE: Application level configuration
  jobs: {}
    # "dummy":
    #   schedule: "0 0 * * *"
    #   timeZone: "Asia/Kathmandu"
    #   enabled: false
    #   command: ["./manage.py", "run-dummy-command"]

# Not required if root image are set
argoHook:
  enabled: true
  image: {}
    # name: WORKER-SET-BY-CICD-IMAGE
    # tag: WORKER-SET-BY-CICD-TAG
    # imagePullPolicy: IfNotPresent
    # imagePullSecrets:
  resources:
    requests:
      cpu: "0.1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 2Gi
  hooks:
    # NOTE: Make sure keys are lowercase
    db-migrate:
      enabled: true
      hook: PostSync
      preserveHistory: true
      command: ["./manage.py", "migrate"]
    collect-static:
      enabled: true
      hook: PostSync
      command: ["./manage.py", "collectstatic", "--noinput"]

extraConfigMapName: ""  # User provided name
envConfigMapName: ""
env: {}

extraSecretsName: ""  # User provided name
secretsName: ""
secrets: {}
  # # Wire infrastructure connection strings here. Values are tpl-evaluated.
  # # Postgres / Redis / S3 should be deployed via a separate infrastructure chart.
  # POSTGRES_DB: "my-app"
  # POSTGRES_USER: "postgres"
  # POSTGRES_PASSWORD: "set-via-extraSecretsName-or-external-secret"
  # POSTGRES_HOST: "my-app-postgres"
  # POSTGRES_PORT: "5432"
  # REDIS_URL: "redis://my-app-redis-master:6379/0"
  # AWS_S3_ENDPOINT_URL: "https://my-app-minio.example.com/"
  # AWS_S3_REGION: "us-east-1"
  # AWS_S3_BUCKET_STATIC_NAME: static-data
  # AWS_S3_BUCKET_MEDIA_NAME: media-data

serviceAccountName: ""
serviceAccount:
  create: false
  annotations: {}
  labels: {}
  automountServiceAccountToken: true

# Azure configurations
secretsStoreCsiDriverProviderName: ""
secretsStoreCsiDriver:
  create: false
  provider: azure  # Only azure is supported
  parameters:
    usePodIdentity: "false"
    clientID: ""
    keyvaultName: ""
    tenantId: ""
  secretsKeyMap: {}  # k8s Secret Key -> VaultKey

# extraManifests: [] or {}
