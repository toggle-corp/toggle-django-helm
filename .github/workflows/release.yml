name: Generate release

on:
  push:
    tags:
      - "*.*.*"


permissions:
  contents: write
  packages: write


jobs:
  helm-publish:
    name: CI
    uses: ./.github/workflows/helm-publish.yml

  generate-release:
    name: Generate release
    runs-on: ubuntu-22.04
    needs:
      - helm-publish

    steps:
      - uses: actions/checkout@v4

      - name: Set the release version
        id: release
        shell: bash
        run: |
          RELEASE_VERSION=${GITHUB_REF:10}

          IS_PRERELEASE=false
          if [[ "$RELEASE_VERSION" == *dev* ]]; then
              IS_PRERELEASE=true
          fi

          {
            echo "release_version=${RELEASE_VERSION}"
            echo "is_prerelease=${IS_PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::Release version: ${RELEASE_VERSION}"
          echo "::notice::Is prerelease: ${IS_PRERELEASE}"

      # CHANGELOG.md is generated by ./release.sh and committed in the tagged
      # commit, so the release notes are the topmost section of it.
      - name: Extract the release notes
        shell: bash
        run: |
          awk '/^## /{ section++ } section == 1' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::No release notes found in CHANGELOG.md"
            exit 1
          fi

          cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "${{ steps.release.outputs.release_version }}"
          prerelease: ${{ steps.release.outputs.is_prerelease }}
          body_path: RELEASE_NOTES.md
